version: "3.8"

services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - "127.0.0.1:${PORT_BACKEND}:${PORT_BACKEND}"
        environment:
            - NODE_ENV=${NODE_ENV}
            - DB_USER=${DB_USER}
            - DB_HOST=${DB_HOST}
            - DB_NAME=${DB_NAME}
            - DB_PASSWORD=${DB_PASSWORD}
            - DB_PORT=${DB_PORT}
            - JWT_SECRET=${JWT_SECRET}
            - PORT=${PORT_BACKEND}
            - EMAIL=${EMAIL}
            - MAILJET_API_KEY=${MAILJET_API_KEY}
            - MAILJET_SECRET_KEY=${MAILJET_SECRET_KEY}
            - DATABASE_VERSION=${DATABASE_VERSION}
            - ORIGIN_URL=${ORIGIN_URL}
            - SERVER_URL=${SERVER_URL}
        depends_on:
            - db
        restart: unless-stopped

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile.frontend
        ports:
            - "127.0.0.1:${PORT_FRONTEND}:80"
        environment:
            - NODE_ENV=${NODE_ENV}
            - SERVER_URL=${SERVER_URL}
            - ORIGIN_URL=${ORIGIN_URL}
        depends_on:
            - backend
        restart: unless-stopped

    db:
        image: postgres:14-alpine # Utilise l'image officielle PostgreSQL au lieu de Docker Hub custom
        environment:
            - POSTGRES_USER=${DB_USER}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_DB=${DB_NAME}
        ports:
            - "127.0.0.1:${DB_PORT}:${DB_PORT}"
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./database_script.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

volumes:
    pgdata:
